name: Bug report
description: Report a problem with a Graalbase service or tool.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a Graalbase service or tool does not behave as expected. For how-to or documentation questions, use the Question or support request form. Search existing issues first.

        Issues are public. Do not include passwords, access tokens, credentials, private keys, or customer data. Review logs and diagnostics before attaching them. For a suspected security vulnerability, use GitHub's private vulnerability reporting if it is enabled for the affected repository.

  - type: input
    id: affected_area
    attributes:
      label: Which service or tool is affected?
      description: Name the service or tool, such as Database, Auth, Storage, Observability, Gateway, Graalbase CLI, Graalbase JavaScript SDK, or Studio.
      placeholder: Service or tool name
    validations:
      required: true

  - type: dropdown
    id: project_target
    attributes:
      label: Where did you see the problem?
      description: Choose the target project if the problem is project-specific.
      options:
        - Local project
        - Hosted project
        - Both
        - Not sure
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe what you were trying to do and what happened.
      placeholder: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: impact_and_workaround
    attributes:
      label: Impact and workaround
      description: What is blocked or affected? How often does it happen, and have you found a workaround?
    validations:
      required: false

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reproduces the problem. For CLI issues, include the exact command that failed.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        For a local project stack problem, run `graalbase status --diagnostics` if it is available in your CLI version. The ZIP contains raw logs and JVM crash reports, which may include sensitive data. Review it before sharing, and do not attach it to a public issue. Include a short, redacted error excerpt below. If maintainers need the full archive, ask for a private transfer method.

  - type: textarea
    id: diagnostics_archive
    attributes:
      label: Diagnostics archive
      description: If you created and reviewed an archive, note that it is available. Do not attach the ZIP or add a public download link.
      placeholder: Reviewed and available if needed.
    validations:
      required: false

  - type: textarea
    id: versions_and_setup
    attributes:
      label: Versions and setup
      description: For a local stack, include the Graalbase version. Also include the Graalbase CLI or JavaScript SDK version and operating system. For a local project, include relevant project directory or stack details.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Redacted error details
      description: Add a short error excerpt or screenshot. Remove credentials, private keys, and customer data. Do not paste full log dumps.
    validations:
      required: false
